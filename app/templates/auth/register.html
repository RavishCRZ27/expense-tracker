{% extends "base.html" %}
{% block title %}Register — Expense Tracker{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-indigo-600 items-center justify-center shadow-2xl shadow-violet-500/30 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-violet-400 to-indigo-400 bg-clip-text text-transparent">Create Account</h1>
            <p class="text-gray-500 mt-1">Start tracking your expenses today</p>
        </div>

        <!-- Register Card -->
        <div class="bg-gray-900/50 backdrop-blur-xl border border-white/5 rounded-2xl p-8 shadow-2xl">
            {% if error %}
            <div class="mb-6 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm" id="register-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register" class="space-y-4" id="register-form">
                <div>
                    <label for="full_name" class="block text-sm font-medium text-gray-300 mb-1.5">Full Name</label>
                    <input type="text" id="full_name" name="full_name" autocomplete="name"
                           class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                           placeholder="Optional">
                </div>
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                           minlength="3" maxlength="50">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                           class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                           class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                           minlength="6">
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-1.5">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                           class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                           minlength="6">
                </div>
                <button type="submit" id="register-submit"
                        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-semibold hover:from-violet-500 hover:to-indigo-500 transition-all duration-200 shadow-lg shadow-violet-500/20 hover:shadow-violet-500/40 focus:outline-none focus:ring-2 focus:ring-violet-500/50 mt-2">
                    Create Account
                </button>
            </form>
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">
            Already have an account?
            <a href="/login" class="text-violet-400 hover:text-violet-300 font-medium transition-colors" id="login-link">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
