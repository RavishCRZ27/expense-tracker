{% extends "base.html" %}
{% block title %}Login — Expense Tracker{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md animate-scale-in">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-400 items-center justify-center shadow-2xl shadow-emerald-500/20 mb-4 animate-pulse-glow">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="text-2xl font-bold gradient-text">Welcome Back</h1>
            <p class="text-slate-500 mt-1">Sign in to your Expense Tracker</p>
        </div>

        <!-- Login Card -->
        <div class="card p-8 shadow-2xl">
            {% if error %}
            <div class="mb-6 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm" id="login-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5" id="login-form">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="input-field">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="input-field">
                </div>
                <button type="submit" id="login-submit"
                        class="w-full py-3 px-4 rounded-xl btn-primary text-base">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-slate-500 text-sm mt-6">
            Don't have an account?
            <a href="/register" class="text-emerald-400 hover:text-emerald-300 font-medium transition-colors" id="register-link">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
