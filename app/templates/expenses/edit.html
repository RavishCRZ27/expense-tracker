{% extends "base.html" %}
{% block title %}Edit Expense — Expense Tracker{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto animate-slide-up">
    <div class="flex items-center gap-3 mb-6">
        <a href="/expenses" class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <h1 class="text-xl font-bold text-white">Edit Expense</h1>
    </div>

    <div class="card p-6">
        {% if error %}
        <div class="mb-6 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm" id="edit-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/expenses/{{ expense.id }}/edit" class="space-y-5" id="edit-expense-form">
            <div>
                <label for="amount" class="block text-sm font-medium text-slate-300 mb-1.5">Amount (₹)</label>
                <input type="number" id="amount" name="amount" required step="0.01" min="0.01"
                       class="input-field" value="{{ expense.amount }}">
            </div>

            <div>
                <label for="expense_date" class="block text-sm font-medium text-slate-300 mb-1.5">Date</label>
                <input type="date" id="expense_date" name="expense_date" required
                       class="input-field" value="{{ expense.date.isoformat() }}">
            </div>

            <div>
                <label for="category_id" class="block text-sm font-medium text-slate-300 mb-1.5">Category</label>
                <select id="category_id" name="category_id" required class="input-field">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id == expense.category_id %}selected{% endif %}>{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-slate-300 mb-1.5">Description</label>
                <input type="text" id="description" name="description" maxlength="255"
                       class="input-field" value="{{ expense.description or '' }}" placeholder="Optional description">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" id="edit-submit"
                        class="flex-1 py-3 rounded-xl btn-primary text-sm">
                    Save Changes
                </button>
                <a href="/expenses" class="py-3 px-5 rounded-xl btn-secondary text-sm flex items-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
