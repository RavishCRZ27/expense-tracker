{% extends "base.html" %}
{% block title %}Add Expense — Expense Tracker{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="/expenses" class="text-sm text-gray-500 hover:text-gray-300 transition-colors flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back to Expenses
        </a>
        <h1 class="text-2xl font-bold text-white mt-2">Add Expense</h1>
    </div>

    <div class="bg-gray-900/50 backdrop-blur-xl border border-white/5 rounded-2xl p-6 shadow-2xl">
        {% if error %}
        <div class="mb-6 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm" id="expense-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/expenses/add" class="space-y-5" id="add-expense-form">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-300 mb-1.5">Amount (₹)</label>
                <input type="number" id="amount" name="amount" required step="0.01" min="0.01"
                       class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white text-lg font-semibold placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                       placeholder="0.00">
            </div>

            <div>
                <label for="category_id" class="block text-sm font-medium text-gray-300 mb-1.5">Category</label>
                <select id="category_id" name="category_id" required
                        class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all">
                    <option value="" disabled selected>Select a category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="expense_date" class="block text-sm font-medium text-gray-300 mb-1.5">Date</label>
                <input type="date" id="expense_date" name="expense_date" required value="{{ today }}"
                       class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-300 mb-1.5">Description <span class="text-gray-600">(optional)</span></label>
                <input type="text" id="description" name="description" maxlength="255"
                       class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-white/5 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all"
                       placeholder="What was this expense for?">
            </div>

            <button type="submit" id="submit-expense"
                    class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-semibold hover:from-violet-500 hover:to-indigo-500 transition-all duration-200 shadow-lg shadow-violet-500/20 hover:shadow-violet-500/40 focus:outline-none focus:ring-2 focus:ring-violet-500/50">
                Add Expense
            </button>
        </form>
    </div>
</div>
{% endblock %}
